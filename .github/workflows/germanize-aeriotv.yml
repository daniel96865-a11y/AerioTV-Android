name: Maintain Streamy 3.0 German UI

on:
  push:
    branches: [ deutsch ]
    paths:
      - .github/workflows/germanize-aeriotv.yml
      - tools/germanize.py

permissions:
  contents: write

jobs:
  germanize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deutsch
          fetch-depth: 0

      - name: Apply Streamy 3.0 German UI changes
        run: python3 tools/germanize.py

      - name: Commit German variant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md settings.gradle.kts GERMAN_TRANSLATION_STATUS.md
          git commit -m "Update Streamy 3.0 German UI" || true
          git push origin HEAD:deutsch

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Streamy 3.0 GitHub release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubRelease

      - name: Upload unsigned Streamy 3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamy-3.0-unsigned
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
