name: Germanize AerioTV

on:
  push:
    branches: [ deutsch ]
    paths:
      - .github/workflows/germanize-aeriotv.yml
      - tools/germanize.py

permissions:
  contents: write

jobs:
  germanize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deutsch
          fetch-depth: 0

      - name: Apply German fork changes
        run: python3 tools/germanize.py

      - name: Commit German variant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md settings.gradle.kts GERMAN_TRANSLATION_STATUS.md
          git commit -m "Create German AerioTV variant" || true
          git push origin HEAD:deutsch

      - name: Build German GitHub release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubRelease

      - name: Upload unsigned German APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-Deutsch-0.5.9-de1-unsigned
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
