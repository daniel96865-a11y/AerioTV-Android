name: Publish Streamy 3.0.1 one-shot

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-streamy-3.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Streamy 3.0.1
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubRelease

      - name: Restore Streamy private signing backup
        uses: actions/download-artifact@v4
        with:
          name: Streamy3-PRIVATE-Signing-Backup
          path: ${{ runner.temp }}/streamy3-signing
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35591147466

      - name: Check signing backup
        run: |
          test -n "$(find "$RUNNER_TEMP/streamy3-signing" -type f -name '*.jks' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/streamy3-signing" -type f -name 'password.txt' -print -quit)"

      - name: Sign and verify Streamy 3.0.1
        run: |
          UNSIGNED="$(find app/build/outputs/apk/github/release -name '*-unsigned.apk' -type f | head -1)"
          KEYSTORE="$(find "$RUNNER_TEMP/streamy3-signing" -type f -name '*.jks' | head -1)"
          PASSFILE="$(find "$RUNNER_TEMP/streamy3-signing" -type f -name 'password.txt' | head -1)"
          PASS="$(cat "$PASSFILE")"
          OUT="$RUNNER_TEMP/Streamy-3.0.1.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -f "$UNSIGNED"
          test -f "$KEYSTORE"
          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-key-alias streamy3             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --out "$OUT" "$UNSIGNED"
          VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$OUT")"
          printf '%s\n' "$VERIFY"
          echo "$VERIFY" | grep -qi "7af8b812a548e1a31c90e78c586d2859b2909a57c78d24f942c38288242776dc"
          sha256sum "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish v3.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.0.1 "$APK#Streamy-3.0.1.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.0.1 "$APK#Streamy-3.0.1.apk"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Streamy 3.0.1"               --notes "Streamy 3.0.1: vollständigeres deutsches Branding und weitere Übersetzungen, korrigierter In-App-Updater mit passendem Streamy-Signaturzertifikat. Eine gemeinsame APK für Handy, Tablet und Android TV / Google TV."
          fi
