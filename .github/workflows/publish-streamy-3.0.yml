name: Publish Streamy 3.0

on:
  push:
    branches: [ deutsch ]
    paths:
      - .github/workflows/publish-streamy-3.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deutsch
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Streamy 3.0
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubRelease

      - name: Create private Streamy 3.0 release key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/streamy3-signing"
          PASS="$(openssl rand -hex 32)"
          printf '%s' "$PASS" > "$RUNNER_TEMP/streamy3-signing/password.txt"
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/streamy3-signing/Streamy3-release-2026.jks"             -storepass "$PASS" -keypass "$PASS"             -alias streamy3 -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=Streamy 3.0 Release, OU=DG Studios, O=DG Studios, C=DE"
          {
            echo "STREAMY 3.0 PRIVATE RELEASE SIGNING BACKUP"
            echo "Alias: streamy3"
            echo "Store password: $PASS"
            echo "Key password: $PASS"
          } > "$RUNNER_TEMP/streamy3-signing/credentials.txt"
          keytool -list -v             -keystore "$RUNNER_TEMP/streamy3-signing/Streamy3-release-2026.jks"             -storepass "$PASS" -alias streamy3             | grep -E "SHA256:|Valid from:"             > "$RUNNER_TEMP/streamy3-signing/fingerprint.txt"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(cat "$RUNNER_TEMP/streamy3-signing/password.txt")"
          UNSIGNED="$(find app/build/outputs/apk/github/release -name '*-unsigned.apk' -type f | head -1)"
          test -f "$UNSIGNED"
          OUT="$RUNNER_TEMP/Streamy-3.0.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/streamy3-signing/Streamy3-release-2026.jks"             --ks-key-alias streamy3             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --out "$OUT" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/streamy3-signing/apk-signature.txt"
          grep -q "Verified using v2 scheme.*true" "$RUNNER_TEMP/streamy3-signing/apk-signature.txt"
          grep -q "Verified using v3 scheme.*true" "$RUNNER_TEMP/streamy3-signing/apk-signature.txt"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/streamy3-signing/apk-sha256.txt"

      - name: Save private signing backup
        uses: actions/upload-artifact@v4
        with:
          name: Streamy3-PRIVATE-Signing-Backup
          path: |
            ${{ runner.temp }}/streamy3-signing/Streamy3-release-2026.jks
            ${{ runner.temp }}/streamy3-signing/credentials.txt
            ${{ runner.temp }}/streamy3-signing/fingerprint.txt
            ${{ runner.temp }}/streamy3-signing/apk-signature.txt
            ${{ runner.temp }}/streamy3-signing/apk-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Streamy-3.0.apk"
          if gh release view v3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.0 "$APK#Streamy-3.0.apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v3.0 --repo "$GITHUB_REPOSITORY"               --title "Streamy 3.0"               --notes "Streamy 3.0 für Handy, Tablet und Android TV. Deutsche Oberfläche, Streamy-Branding, M3U/Xtream/EPG/DVR/Multiview und Media3-Wiedergabe. Technische Grundlage: AerioTV for Android; diese modifizierte Variante bleibt unter GNU GPL v3 oder später."
          else
            gh release create v3.0 "$APK#Streamy-3.0.apk"               --repo "$GITHUB_REPOSITORY"               --target deutsch               --title "Streamy 3.0"               --notes "Streamy 3.0 für Handy, Tablet und Android TV. Deutsche Oberfläche, Streamy-Branding, M3U/Xtream/EPG/DVR/Multiview und Media3-Wiedergabe. Technische Grundlage: AerioTV for Android; diese modifizierte Variante bleibt unter GNU GPL v3 oder später."
          fi
