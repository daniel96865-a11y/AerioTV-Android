name: Publish Streamy 3.0.9 German UI and code pairing
# Streamy 3.0.9: Xtream descriptions, TV D-pad navigation and German UI

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-streamy-3.0.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore permanent Streamy 3.0 signing backup
        uses: actions/download-artifact@v4
        with:
          name: Streamy3-PRIVATE-Signing-Backup-COMPLETE
          path: ${{ runner.temp }}/streamy3-signing
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35603949656

      - name: Verify signing backup
        run: |
          test -f "$RUNNER_TEMP/streamy3-signing/Streamy3-release.jks"
          test -f "$RUNNER_TEMP/streamy3-signing/password.txt"
          test -f "$RUNNER_TEMP/streamy3-signing/fingerprint.txt"
          test "$(cat "$RUNNER_TEMP/streamy3-signing/fingerprint.txt")" = "1719ef5261a5520899a8fcbed1898a52f4775abfc87a62d6df4ace93baa1ef05"

      - name: Build Streamy 3.0.9
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubRelease

      - name: Sign and verify Streamy 3.0.9
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/github/release -name '*-unsigned.apk' -type f | head -1)"
          PASS="$(cat "$RUNNER_TEMP/streamy3-signing/password.txt")"
          OUT="$RUNNER_TEMP/Streamy-3.0.9.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/streamy3-signing/Streamy3-release.jks" \
            --ks-key-alias streamy3 \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT" "$UNSIGNED"
          VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$OUT")"
          printf '%s\n' "$VERIFY"
          echo "$VERIFY" | tr -d ':' | grep -qi "1719ef5261a5520899a8fcbed1898a52f4775abfc87a62d6df4ace93baa1ef05"
          sha256sum "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Create v3.0.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v3.0.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.0.9 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Streamy 3.0.9" \
              --notes "Streamy 3.0.9: Filme und Serien laden fehlende Beschreibungen jetzt direkt aus den Xtream-Detailendpunkten get_vod_info und get_series_info. TMDB ist nur noch Ergänzung, wenn der Anbieter keine Metadaten liefert. Die TV-Fokuskorrektur für Kategorien wie Doku und die deutsche Oberfläche sind ebenfalls enthalten."
          fi

      - name: Upload Streamy 3.0.9 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.0.9 "$APK#Streamy-3.0.9.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
