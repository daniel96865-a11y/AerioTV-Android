name: Streamy repository cleanup

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/cleanup-streamy-repo.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete pre-Streamy release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.5.10-de1 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true

      - name: Remove obsolete pre-Streamy branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/deutsch" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/publish-0.5.11-de1" || true

      - name: Remove obsolete pre-Streamy workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/35583410411" || true
