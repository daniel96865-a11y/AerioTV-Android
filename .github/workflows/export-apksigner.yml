name: Export Android APK signer

on:
  push:
    branches: [ deutsch ]
    paths:
      - .github/workflows/export-apksigner.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate latest Android build tools
        id: bt
        run: |
          DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using $DIR"
      - name: Package apksigner
        run: |
          mkdir -p export/lib
          cp "${{ steps.bt.outputs.dir }}/apksigner" export/apksigner
          cp "${{ steps.bt.outputs.dir }}/lib/apksigner.jar" export/lib/apksigner.jar
          chmod +x export/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner
          path: export
          if-no-files-found: error
